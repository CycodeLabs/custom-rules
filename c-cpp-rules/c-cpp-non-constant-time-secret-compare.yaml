rules:
  - id: c-cpp-non-constant-time-secret-compare
    languages: [c, cpp]
    paths:
      include:
        - "*.c"
        - "*.h"
        - "*.cpp"
        - "*.cc"
        - "*.cxx"
        - "*.c++"
        - "*.hpp"
        - "*.hh"
        - "*.hxx"
        - "*.inc"
    severity: WARNING
    message: >-
      A secret-bearing value (MAC, auth tag, HMAC, digest, signature, key, password) is
      compared with `memcmp`, which returns as soon as the first differing byte is found. The
      execution time leaks how many leading bytes matched, letting an attacker forge a valid
      MAC/tag/signature byte-by-byte over many attempts. Remediation: compare with a
      constant-time routine such as `CRYPTO_memcmp` (OpenSSL), `timingsafe_bcmp`, or an
      explicit constant-time comparison that always inspects every byte.
    metadata:
      vulnerability_class: Observable Timing Discrepancy
      help: |
        ## Summary
        A secret-bearing value (MAC, auth tag, HMAC, digest, signature, key, password) is compared with `memcmp`, which returns as soon as the first differing byte is found. The execution time leaks how many leading bytes matched, letting an attacker forge a valid MAC/tag/signature byte-by-byte over many attempts. Remediation: compare with a constant-time routine such as `CRYPTO_memcmp` (OpenSSL), `timingsafe_bcmp`, or an explicit constant-time comparison that always inspects every byte.

        ## Remediation
        Use a constant-time comparison (CRYPTO_memcmp / timingsafe_bcmp) for secrets/MACs.
      category: security
      cwe:
        - "CWE-208: Observable Timing Discrepancy"
        - "CWE-347: Improper Verification of Cryptographic Signature"
      references:
        - https://cwe.mitre.org/data/definitions/208.html
      confidence: MEDIUM
      likelihood: LOW
      impact: HIGH
      subcategory: [vuln]
      technology: [c, cpp]
      remediation: >-
        Use a constant-time comparison (CRYPTO_memcmp / timingsafe_bcmp) for secrets/MACs.
    pattern-either:
      - patterns:
          - pattern: $F($A, $B, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^([a-z0-9]+_)?memcmp$
          - metavariable-regex:
              metavariable: $A
              regex: (?i).*(hmac|mac|tag|signature|sig|digest|hash|secret|passwd|password|passphrase|proof)
          # comparing against a string literal (e.g. memcmp(x,"sign",..)) is matching, not a secret compare
          - metavariable-pattern:
              metavariable: $A
              patterns:
                - pattern-not: '"..."'
                - pattern-not: ($T)"..."
          - pattern-not: CRYPTO_memcmp(...)
          - pattern-not: timingsafe_bcmp(...)
          - pattern-not: timingsafe_memcmp(...)
          - pattern-not: consttime_memcmp(...)
      - patterns:
          - pattern: $F($A, $B, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^([a-z0-9]+_)?memcmp$
          - metavariable-regex:
              metavariable: $B
              regex: (?i).*(hmac|mac|tag|signature|sig|digest|hash|secret|passwd|password|passphrase|proof)
          - metavariable-pattern:
              metavariable: $B
              patterns:
                - pattern-not: '"..."'
                - pattern-not: ($T)"..."
          - pattern-not: CRYPTO_memcmp(...)
          - pattern-not: timingsafe_bcmp(...)
          - pattern-not: timingsafe_memcmp(...)
          - pattern-not: consttime_memcmp(...)
