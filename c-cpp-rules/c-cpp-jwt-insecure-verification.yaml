rules:
  - id: c-cpp-jwt-insecure-verification
    languages: [c, cpp]
    paths:
      include:
        - "*.c"
        - "*.h"
        - "*.cpp"
        - "*.cc"
        - "*.cxx"
        - "*.c++"
        - "*.hpp"
        - "*.hh"
        - "*.hxx"
        - "*.inc"
    severity: WARNING
    message: >-
      Possible JWT/JWS verification bypass. Either the `alg` is set to / accepted as "none"
      (which disables signature verification entirely, so any attacker can forge a token), or the
      verification key material is taken from a header the token itself controls (`x5c`, `x5u`,
      `jwk`, `jku`). Trusting token-supplied key material proves the token is self-consistent, not
      that it came from a trusted issuer. Remediation: reject `alg: none`; pin the accepted
      algorithms to an allow-list; and verify the signature against a key obtained from your own
      trust store / configured issuer, never from the token's headers.
    metadata:
      vulnerability_class: Improper Verification of Cryptographic Signature
      help: |
        ## Summary
        Possible JWT/JWS verification bypass. Either the `alg` is set to / accepted as "none" (which disables signature verification entirely, so any attacker can forge a token), or the verification key material is taken from a header the token itself controls (`x5c`, `x5u`, `jwk`, `jku`). Trusting token-supplied key material proves the token is self-consistent, not that it came from a trusted issuer. Remediation: reject `alg: none`; pin the accepted algorithms to an allow-list; and verify the signature against a key obtained from your own trust store / configured issuer, never from the token's headers.

        ## Remediation
        Reject alg:none, allow-list algorithms, and verify against a key from your trust store (not from the token's x5c/jwk/jku headers).
      category: security
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
        - "CWE-345: Insufficient Verification of Data Authenticity"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/347.html
      confidence: LOW
      likelihood: MEDIUM
      impact: CRITICAL
      subcategory: [vuln]
      technology: [c, cpp, jwt]
      remediation: >-
        Reject alg:none, allow-list algorithms, and verify against a key from your trust store
        (not from the token's x5c/jwk/jku headers).
    pattern-either:
      # algorithm assigned "none"
      - patterns:
          - pattern-either:
              - pattern: $ALG = "none"
              - pattern: $ALG = "None"
              - pattern: $ALG = "NONE"
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i).*alg
      # algorithm compared against "none" (accept/route path)
      - patterns:
          - pattern-either:
              - pattern: $F($ALG, "none")
              - pattern: $F($ALG, "None")
              - pattern: $F($ALG, "NONE")
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^([a-z0-9]+_)?str(n|case)?cmp$
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i).*alg
      # verification key material pulled from token-controlled headers
      - pattern: $F(..., "x5c", ...)
      - pattern: $F(..., "x5u", ...)
      - pattern: $F(..., "jku", ...)
