rules:
  - id: c-cpp-hardcoded-credential
    languages: [c, cpp]
    paths:
      include:
        - "*.c"
        - "*.h"
        - "*.cpp"
        - "*.cc"
        - "*.cxx"
        - "*.c++"
        - "*.hpp"
        - "*.hh"
        - "*.hxx"
        - "*.inc"
    severity: WARNING
    message: >-
      A credential-like variable (password, secret, API key, private key, passphrase) is
      assigned a hardcoded string literal. Hardcoded secrets are extractable from the binary,
      cannot be rotated without a rebuild, and are typically shared across all deployments.
      Remediation: load secrets at runtime from a secrets manager, environment, protected
      keystore, or hardware security module; never commit them to source. If this is a real
      secret, rotate it.
    metadata:
      vulnerability_class: Use of Hard-coded Credentials
      help: |
        ## Summary
        A credential-like variable (password, secret, API key, private key, passphrase) is assigned a hardcoded string literal. Hardcoded secrets are extractable from the binary, cannot be rotated without a rebuild, and are typically shared across all deployments. Remediation: load secrets at runtime from a secrets manager, environment, protected keystore, or hardware security module; never commit them to source. If this is a real secret, rotate it.

        ## Remediation
        Load secrets at runtime from a secrets manager/keystore/env; do not embed in source.
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-259: Use of Hard-coded Password"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      subcategory: [vuln]
      technology: [c, cpp]
      remediation: >-
        Load secrets at runtime from a secrets manager/keystore/env; do not embed in source.
    patterns:
      - pattern-either:
          - pattern: $TYPE $VAR = "...";
          - pattern: $VAR = "...";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(passwd|password|secret|api_?key|priv_?key|privatekey|credential|passphrase)
      - pattern-not: $TYPE $VAR = "";
      - pattern-not: $VAR = "";
