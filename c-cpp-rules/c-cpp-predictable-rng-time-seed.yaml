rules:
  - id: c-cpp-predictable-rng-time-seed
    languages: [c, cpp]
    paths:
      include:
        - "*.c"
        - "*.h"
        - "*.cpp"
        - "*.cc"
        - "*.cxx"
        - "*.c++"
        - "*.hpp"
        - "*.hh"
        - "*.hxx"
        - "*.inc"
    severity: WARNING
    message: >-
      A seeding / entropy / DRBG / RNG routine derives its seed material from a time or uptime
      source (uptime-in-ms, wall-clock, tick count, clock, gettimeofday, rdtsc). Time-based values
      are low-entropy and estimable by an attacker who can bound the boot/generation time, so every
      key, IV, nonce, salt, and signature `k` produced by this PRNG becomes predictable/brute-forceable.
      Remediation: seed the DRBG from a hardware/OS CSPRNG (`getrandom`/`/dev/urandom`, a hardware
      RNG, or a vetted jitter/entropy source); time may be mixed in as a non-primary input only.
    metadata:
      vulnerability_class: Use of Predictable PRNG Seed
      help: |
        ## Summary
        A seeding / entropy / DRBG / RNG routine derives its seed material from a time or uptime source (uptime-in-ms, wall-clock, tick count, clock, gettimeofday, rdtsc). Time-based values are low-entropy and estimable by an attacker who can bound the boot/generation time, so every key, IV, nonce, salt, and signature `k` produced by this PRNG becomes predictable/brute-forceable. Remediation: seed the DRBG from a hardware/OS CSPRNG (`getrandom`/`/dev/urandom`, a hardware RNG, or a vetted jitter/entropy source); time may be mixed in as a non-primary input only.

        ## Remediation
        Seed the DRBG from an OS/hardware CSPRNG; do not derive seed material from time/uptime.
      category: security
      cwe:
        - "CWE-337: Predictable Seed in Pseudo-Random Number Generator"
        - "CWE-330: Use of Insufficiently Random Values"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      references:
        - https://cwe.mitre.org/data/definitions/337.html
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      subcategory: [vuln]
      technology: [c, cpp]
      remediation: >-
        Seed the DRBG from an OS/hardware CSPRNG; do not derive seed material from time/uptime.
    patterns:
      - pattern: $TIMEFN(...)
      - metavariable-regex:
          metavariable: $TIMEFN
          regex: (?i)^([a-z0-9]+_)?(getuptime[a-z0-9]*|uptimeinms|timegmt|gettimeofday|getticks?|tickcount|gettickcount|rdtsc|clock|time)$
      - pattern-inside: |
          $RT $FN(...) { ... }
      - metavariable-regex:
          metavariable: $FN
          regex: (?i).*(seed|entropy|drbg|prng|rng|getrandom|randominit|nonce|makerandom)
